services:
  postgis:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: geo-search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo-search}
      POSTGRES_USER: geo-search
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 --username geo-search --dbname geo-search"]
      interval: 2s
      timeout: 5s
      retries: 30
  django:
    platform: linux/amd64
    build:
      context: .
      target: development
    user: default
    init: true
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      APPLY_MIGRATIONS: "1"
      DATABASE_URL: postgis://geo-search:${DATABASE_URL_PASSWORD:-${POSTGRES_PASSWORD:-geo-search}}@postgis/geo-search
      DEBUG: "1"
      REQUIRE_AUTHORIZATION: "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
